spring.application.name=notification-service
server.port=8084

#Database
spring.datasource.url=jdbc:mysql://localhost:3306/notification_db
spring.datasource.username=root
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

#kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

# Kafka Topics
kafka.topic.email=notification.email.send
kafka.topic.webhook=notification.webhook.send

#mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:notifyhub@gmail.com}
spring.mail.password=${MAIL_PASSWORD:notifyhub_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Eureka client registry
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

#Resilience4j
resilience4j.circuitbreaker.instances.templateService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.templateService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.templateService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.templateService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.templateService.permittedNumberOfCallsInHalfOpenState=3

resilience4j.retry.instances.templateService.maxAttempts=3
resilience4j.retry.instances.templateService.waitDuration=500ms

resilience4j.timelimiter.instances.templateService.timeoutDuration=${TIMELIMITER_DURATION:3s}

#monitoring
management.endpoints.web.exposure.include=health, circuitbreakers
management.health.circuitbreakers.enabled=true
