spring.application.name=ai-service
server.port=8086

#DB
spring.datasource.url=jdbc:mysql://localhost:3306/ai_db
spring.datasource.username=root
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

#GEMINI
gemini.base-url=https://generativelanguage.googleapis.com
gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

#Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=ai-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
#spring.kafka.listener.ack-mode=record

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Kafka Topics
kafka.topic.template.enrichment.req=template.enrichment.request
kafka.topic.template.enrichment.res=template.enrichment.response

#Eureka client registry
#eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
#eureka.instance.prefer-ip-address=true


# Circuit Breaker
resilience4j.circuitbreaker.instances.geminiClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.geminiClient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.geminiClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.geminiClient.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.geminiClient.permitted-number-of-calls-in-half-open-state=3

# Retry
resilience4j.retry.instances.geminiClient.max-attempts=3
resilience4j.retry.instances.geminiClient.wait-duration=1s
resilience4j.retry.instances.geminiClient.enable-exponential-backoff=true
resilience4j.retry.instances.geminiClient.exponential-backoff-multiplier=2
resilience4j.retry.instances.geminiClient.retry-exceptions[0]=org.springframework.web.reactive.function.client.WebClientResponseException$ServiceUnavailable
resilience4j.retry.instances.geminiClient.retry-exceptions[1]=org.springframework.web.reactive.function.client.WebClientResponseException$TooManyRequests
resilience4j.retry.instances.geminiClient.retry-exceptions[2]=org.springframework.web.reactive.function.client.WebClientRequestException
resilience4j.retry.instances.geminiClient.retry-exceptions[3]=java.util.concurrent.TimeoutException